spring.config.import=classpath:security-routes.properties

spring.datasource.url=jdbc:h2:mem:integrationtestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

application.security.jwt.secret-key=404E634A664D6A416E445267556B58703273476B3576245367566B596D327245
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

free-limit.default-max-requests=1000
free-limit.default-per-seconds=60

cors.allowed-origins=http://localhost:3000

spring.h2.console.enabled=false

logging.level.root=WARN
logging.level.com.hatirlat=INFO
