# ── Production Profile ─────────────────────────────────────────────────────────
# Loaded when SPRING_PROFILES_ACTIVE=prod

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:hatirlat}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console - disabled in production
spring.h2.console.enabled=false

# Security
application.security.jwt.secret-key=${JWT_SECRET_KEY}
encryption.secret.key=${ENCRYPTION_SECRET_KEY}

# Logging - less verbose in production
logging.level.com.hatirlat.backend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.root=WARN

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.frontend-url=${FRONTEND_URL}

# Cookie settings (HTTPS in production)
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
